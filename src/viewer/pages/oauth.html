<!DOCTYPE html>
<html lang="__LANG__"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e0d12">
<meta name="referrer" content="no-referrer">
<title>__SITE_NAME__ — __TITLE__</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/fonts.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:radial-gradient(ellipse 80% 60% at 70% 30%, rgba(29,155,209,0.12), transparent),radial-gradient(ellipse 60% 40% at 20% 80%, rgba(251,198,120,0.08), transparent),#0e0d12;
  color:#d1d2d3;font-family:Manrope,system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh;
}
.card{
  width:100%;max-width:420px;padding:36px 32px 28px;
  background:rgba(35,34,42,0.55);
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,0.1);border-radius:16px;
  box-shadow:0 18px 48px -12px rgba(0,0,0,0.65),inset 0 1px 0 rgba(255,255,255,0.08);
}
.logo-wrap{display:flex;justify-content:center;margin-bottom:18px}
.logo-wrap img{width:64px;height:64px;border-radius:12px;box-shadow:0 6px 24px -2px rgba(251,198,120,0.35)}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-0.015em;color:#fff;text-align:center;line-height:1.2}
h1 .atlas{font-family:'Lora',Georgia,serif;font-style:italic;font-weight:600;font-size:1.4em;color:#e8941c;text-shadow:0 1px 2px rgba(0,0,0,0.6),0 0 1px rgba(0,0,0,0.85);letter-spacing:0}
h1 .wordmark{display:inline-flex;align-items:center;gap:.35em;margin-left:.18em;line-height:1}
h1 .mind{display:inline-block;font-family:'Manrope',system-ui,sans-serif;font-weight:700;font-size:0.42em;letter-spacing:0.16em;text-transform:uppercase;color:#eaf6fb;padding:0.28em 0.62em;border-radius:999px;border:1px solid rgba(124,200,235,0.38);box-shadow:inset 0 0 10px rgba(99,102,241,0.5),0 0 12px rgba(29,155,209,0.4);background:#080a14}
h1 .brand{font-family:'Corinthia',cursive;font-weight:700;font-size:1.7em;line-height:1;color:#eef0f2}
.subtitle{font-size:11px;color:#868a90;text-align:center;margin:6px 0 22px;letter-spacing:0.12em;text-transform:uppercase;font-weight:600}
.intro{font-size:14px;color:#d1d2d3;text-align:center;margin:0 0 6px;line-height:1.55}
.intro b{color:#fff}
.note{font-size:12px;color:#868a90;text-align:center;margin:0 0 18px;line-height:1.5}
.note code{color:#b0b1b5;font-family:inherit}
.hint{font-size:12px;color:#868a90;margin:0 0 8px}
.scopes{display:flex;flex-direction:column;gap:6px;margin:0 0 18px;padding:0;list-style:none}
.scopes label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid #2a2a32;background:rgba(0,0,0,0.25);border-radius:8px;cursor:pointer;font-size:13px;line-height:1.45}
.scopes input{margin:2px 0 0;accent-color:#1d9bd1}
.scopes .name{color:#fff;font-weight:600;display:block}
.actions{display:flex;gap:10px}
button{
  flex:1;padding:12px 14px;border:0;border-radius:8px;
  font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  transition:filter 0.12s,transform 0.06s;
}
button.allow{background:#1d9bd1;color:#fff}
button.deny{background:rgba(255,255,255,0.06);color:#d1d2d3;border:1px solid rgba(255,255,255,0.1)}
button:hover{filter:brightness(1.1)}
button:active{transform:scale(0.98)}
.err{color:#fca5a5;font-size:13px;margin:0;text-align:center;background:rgba(248,113,113,0.08);padding:10px 12px;border-radius:7px;border:1px solid rgba(248,113,113,0.22);line-height:1.5}
.footer{text-align:center;margin-top:18px;font-size:11px;color:#5e6066;letter-spacing:0.03em}
</style></head><body>
<div class="card">
  <div class="logo-wrap"><img src="/icon.svg" alt="Atlas" width="64" height="64"></div>
  <h1><span class="brand">__SITE_PREFIX__</span> <span class="wordmark"><span class="atlas">Atlas</span><span class="mind">Mind</span></span></h1>
  <p class="subtitle">__TITLE__</p>
  __CONTENT_HTML__
  <p class="footer">__FOOTER__</p>
</div>
</body></html>
