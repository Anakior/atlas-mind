<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
__KIT_CSS__

  .layers { display: inline-flex; gap: 2px; max-width: 100%; margin: 4px 0 10px; padding: 3px; border-radius: 9px; background: var(--bg-2); overflow-x: auto; scrollbar-width: none; }
  .layers::-webkit-scrollbar { display: none; }
  .layers button { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 0; border-radius: 7px; background: none; color: var(--text-2); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .layers button.on { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px color-mix(in srgb, var(--text) 12%, transparent); }
  .legend { margin: 0 0 8px; color: var(--text-3); font-size: 12px; }

  /* The ranking: a folder per row, its bar as long as its value on the layer, the number beside.
     Rows and subfolders share the list's columns, so the bars start and the numbers end together. */
  .ranks { display: grid; grid-template-columns: minmax(96px, 1.1fr) 2fr max-content 14px; column-gap: 12px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .ranks > *, .open-body > * { grid-column: 1 / -1; }
  .region { display: grid; grid-template-columns: subgrid; align-items: center;
    width: 100%; margin-top: -1px; padding: 9px 12px; border: 0; border-top: 1px solid var(--border); background: none; text-align: left; transition: background .12s; }
  .region:hover, .region.open { background: var(--bg-2); }
  .region .name { overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
  .region.quiet .name, .region.quiet .value { color: var(--text-3); font-weight: 500; }
  .track { height: 8px; border-radius: 4px; background: var(--bg-2); overflow: hidden; }
  .region:hover .track, .region.open .track { background: var(--bg); }
  .track i { display: block; height: 100%; min-width: 4px; border-radius: 4px; background: var(--accent); transition: width .25s; }
  .value { color: var(--text-2); font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .region > svg { color: var(--text-3); }
  .region.open > .chev { transform: rotate(90deg); }
  .open-body { display: grid; grid-template-columns: subgrid; padding: 4px 12px 14px 24px; background: var(--bg-2); }
  .open-body .stats { margin: 0 0 6px; color: var(--text-3); font-size: 12px; }
  .sub { display: grid; grid-template-columns: subgrid; align-items: center;
    width: 100%; padding: 5px 0; border: 0; background: none; text-align: left; }
  .sub .name { overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
  .sub .track { height: 6px; background: var(--bg); }
  .sub > svg { color: var(--text-3); }
  .sub:not(:disabled):hover .name, .sub:not(:disabled):hover > svg { color: var(--accent); }
  .sub:disabled { cursor: default; }
  .sub:disabled .name { color: var(--text-3); }
  .row { display: flex; align-items: center; gap: 10px; margin: 12px 0 0; flex-wrap: wrap; }
  .more { width: 100%; margin-top: -1px; padding: 8px 12px; border: 0; border-top: 1px solid var(--border); background: none; color: var(--text-3); font-size: 12.5px; text-align: left; }
  .more:hover { color: var(--accent); }
  @media (max-width: 480px) {
    .ranks { grid-template-columns: minmax(72px, 1fr) 1fr max-content 14px; column-gap: 8px; }
    .layers button { padding: 5px 9px; }
    .layers svg { display: none; }
    .lines .line small { white-space: normal; }
  }
  .pairs { margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; }
  .pairs li { padding: 3px 0; overflow-wrap: anywhere; }
  .pairs b { font-weight: 600; }

  .lines { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  /* The button goes under the text when both no longer fit side by side. */
  .line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: -1px; padding: 10px 12px; border-top: 1px solid var(--border); }
  .line > div { flex: 1 1 200px; min-width: 0; }
  .line b, .line small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line small { color: var(--text-3); font-size: 12px; }
  .ghosts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .ghosts span { white-space: nowrap; padding: 0 7px; border: 1px dashed var(--removed); border-radius: 999px; color: var(--removed); font-size: 11.5px; }

  /* The review deck: one doc at a time, its opening to read, then a verdict that says what it does. */
  .deck-top { display: flex; align-items: center; gap: 10px; margin: -4px 0 8px; }
  .deck-top .back { margin: 0 auto 0 -4px; }
  .where { color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; }
  .where b { color: var(--text-2); font-weight: 600; }
  .progress { height: 3px; margin: 0 0 18px; border-radius: 2px; background: var(--bg-2); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
  .card h3 { margin: 0; font-size: 17px; line-height: 1.35; text-wrap: balance; }
  .path { margin: 2px 0 8px; color: var(--text-3); font: 12px var(--mono); overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--text-3); font-size: 12px; }
  .preview { margin: 14px 0 0; padding: 12px 14px; border-radius: var(--radius); background: var(--bg-2); color: var(--text-2); font-size: 13px; overflow-wrap: anywhere; }
  .preview.clipped .text { max-height: 13em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
  .preview h4 { margin: 12px 0 3px; color: var(--text); font-size: 13px; font-weight: 650; }
  .preview h4:first-child { margin-top: 0; }
  .preview p, .preview ul, .preview pre { margin: 0 0 7px; }
  .preview p { white-space: pre-line; }
  .preview ul { padding-left: 18px; }
  .preview pre { font: 12px var(--mono); white-space: pre-wrap; }
  .preview .link { margin-top: 4px; }
  .ask { margin: 20px 0 8px; font-size: 13px; font-weight: 600; }
  .verdicts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .verdicts button { position: relative; display: grid; align-content: start; gap: 2px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: none; text-align: left; transition: border-color .12s, background .12s; }
  .verdicts b { display: flex; align-items: center; gap: 7px; font-size: 13.5px; }
  .verdicts b svg { color: var(--tone); }
  .verdicts small { color: var(--text-3); font-size: 12px; line-height: 1.35; }
  .verdicts button:hover { border-color: var(--tone); background: color-mix(in srgb, var(--tone) 8%, transparent); }
  .verdicts .holds { --tone: var(--added); } .verdicts .outdated { --tone: var(--warn); } .verdicts .gone { --tone: var(--removed); }
  .verdicts kbd { position: absolute; top: 9px; right: 10px; }
  kbd { padding: 0 5px; border: 1px solid var(--border); border-radius: 4px; color: var(--text-3); font: 10.5px/16px var(--mono); }
  @media (hover: none) { kbd { display: none; } }
  .later { display: flex; justify-content: flex-end; margin: 6px 0 0; }
  .later button { display: inline-flex; align-items: center; gap: 6px; padding: 4px 2px; border: 0; background: none; color: var(--text-3); font-size: 12.5px; font-weight: 600; }
  .later button:hover { color: var(--accent); }
  .card.busy { opacity: .5; pointer-events: none; }
  .done { padding: 18px; border-radius: var(--radius); background: var(--bg-2); text-align: center; }
  .done h3 { margin: 0 0 4px; }
  .actions { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin: 16px 0 0; }
  .actions .note { margin: 0 auto 0 0; }
  @media (max-width: 480px) { .verdicts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main id="app"></main>
<script>__BRIDGE__</script>
<script>__KIT__</script>
<script>
(function () {
  var app = document.getElementById('app');
  var kit = atlasKit(__I18N__, app);
  var t = kit.t, el = kit.el, add = kit.add, icon = kit.icon, docName = kit.docName;
  var state = { data: null, layer: 'fog', picked: null, showQuiet: false, decisions: [] };

  // What a folder weighs on each layer, and how its number reads. Counts bar against the longest
  // of their list; the AI's share on its own scale, 0 to 100 %.
  var LAYERS = {
    fog: { icon: 'fog', value: function (r) { return r.fog; },
           label: function (r) { return t('of', { n: r.fog, total: r.docs }); } },
    sun: { icon: 'sun', value: function (r) { return r.commits; },
           label: function (r) { return t('n_commits', { n: r.commits }); } },
    storms: { icon: 'bolt', value: function (r) { return r.storms; },
              label: function (r) { return t('n_storms', { n: r.storms }); } },
    wind: { icon: 'wind', share: true, value: function (r) { return r.commits ? r.ai_share : 0; },
            label: function (r) { return r.commits ? Math.round(r.ai_share * 100) + ' %' : '—'; } },
  };

  function regionName(path) {
    return path ? path.split('/').pop() : t('root');
  }

  function period(label) {  // '2026-07' or '2026-Q3', in the reader's words
    var q = /^(\d{4})-Q(\d)$/.exec(label);
    if (q) return t('quarter', { q: q[2], y: q[1] });
    return new Date(label + '-15T12:00:00').toLocaleDateString(kit.lang, { month: 'long', year: 'numeric' });
  }

  function message(text) {
    return atlasApp.request('ui/message', { role: 'user', content: [{ type: 'text', text: text }] });
  }

  function send(button, text) {
    button.disabled = true;
    message(text).then(function (result) {
      if (result && result.isError) throw new Error('?');
      button.textContent = t('sent');
    }).catch(function () { button.disabled = false; });
  }

  // ── the ranking ───────────────────────────────────────────────────────────

  function ranked(regions) {
    var layer = LAYERS[state.layer];
    return regions.slice().sort(function (x, y) { return layer.value(y) - layer.value(x) || y.docs - x.docs; });
  }

  function scale(regions) {
    var layer = LAYERS[state.layer];
    return layer.share ? 1 : Math.max.apply(null, [0].concat(regions.map(layer.value)));
  }

  function bar(value, max) {
    var fill = el('i');
    fill.style.width = (max ? 100 * value / max : 0) + '%';
    fill.hidden = !value;
    return add(el('span', 'track'), fill);
  }

  function stats(region) {
    return t('region_stats', { docs: region.docs, changed: region.changed, commits: region.commits,
                               ai: Math.round(region.ai_share * 100), fog: region.fog });
  }

  // The folders, the heaviest on the layer first; those with nothing on it fold into one line.
  function ranking() {
    var layer = LAYERS[state.layer], rows = ranked(state.data.regions), max = scale(rows);
    var box = el('div', 'ranks');
    var quiet = rows.filter(function (r) { return !layer.value(r); });
    rows.forEach(function (region) {
      if (!layer.value(region) && !state.showQuiet) return;
      var open = state.picked === region.path;
      var row = add(el('button', 'region' + (open ? ' open' : '') + (layer.value(region) ? '' : ' quiet')),
        el('span', 'name', regionName(region.path)), bar(layer.value(region), max),
        el('span', 'value', layer.label(region)), icon('chev'));
      row.dataset.path = region.path;
      row.title = stats(region);
      row.onclick = function () { state.picked = open ? null : region.path; render(); };
      add(box, row, open ? details(region) : null);
    });
    if (quiet.length && !state.showQuiet) {
      var more = el('button', 'more', t('quiet_' + state.layer, { n: quiet.length }));
      more.onclick = function () { state.showQuiet = true; render(); };
      box.appendChild(more);
    }
    return box;
  }

  // An open folder: its subfolders ranked the same way, each one's fog to review, and its storms.
  function details(region) {
    var layer = LAYERS[state.layer], subs = ranked(region.children), max = scale(subs);
    var body = add(el('div', 'open-body'), el('div', 'stats', stats(region)));
    subs.forEach(function (sub) {
      var row = add(el('button', 'sub'), el('span', 'name', regionName(sub.path)), bar(layer.value(sub), max),
        el('span', 'value', layer.label(sub)), sub.fog ? icon('chev') : el('span'));
      if (sub.fog) {
        row.title = t('review_sub', { n: sub.fog });
        row.onclick = function () { deck(sub.path); };
      } else {
        row.disabled = true;
      }
      body.appendChild(row);
    });
    var actions = el('div', 'row');
    if (region.fog) {
      var all = add(el('button', 'primary'), icon('fog'), t('review_all', { n: region.fog }));
      all.onclick = function () { deck(region.path); };
      actions.appendChild(all);
    } else {
      actions.appendChild(el('span', 'note', t('clear')));
    }
    var storms = state.data.storms.filter(function (s) { return within(s.a, region.path) || within(s.b, region.path); });
    if (storms.length) {
      var settle = add(el('button', 'ghost'), icon('bolt'), t('settle', { n: storms.length }));
      settle.onclick = function () {
        send(settle, t('settle_message') + '\n' + storms.map(function (s) {
          return '- ' + s.a + ' ⇄ ' + s.b + (s.subject ? ' (' + s.subject + ')' : '');
        }).join('\n'));
      };
      actions.appendChild(settle);
    }
    body.appendChild(actions);
    if (storms.length) {
      var list = el('ul', 'pairs');
      storms.forEach(function (s) {
        list.appendChild(add(el('li'), el('b', null, docName(s.a)), ' ⇄ ', el('b', null, docName(s.b)),
          s.subject ? ' · ' + s.subject : ''));
      });
      body.appendChild(list);
    }
    return body;
  }

  function layers() {
    var bar = el('div', 'layers');
    Object.keys(LAYERS).forEach(function (name) {
      var button = add(el('button', name === state.layer ? 'on' : ''), icon(LAYERS[name].icon), t('layer_' + name));
      button.onclick = function () { state.layer = name; state.showQuiet = false; render(); };
      bar.appendChild(button);
    });
    return bar;
  }

  function find(path) {
    var found = null;
    state.data.regions.forEach(function (r) {
      if (r.path === path) found = r;
      r.children.forEach(function (c) { if (c.path === path) found = c; });
    });
    return found;
  }

  function regionsOf(path) {  // as the server counts them: the top folder and the one below it
    var parts = path.split('/').slice(0, -1);
    return parts.length ? [parts[0]].concat(parts.length > 1 ? [parts.slice(0, 2).join('/')] : []) : [''];
  }

  function within(path, region) {
    return region === '' ? path.indexOf('/') === -1 : path.indexOf(region + '/') === 0;
  }

  function missed() {
    var series = state.data.missed || [];
    if (!series.length) return null;
    var lines = el('div', 'lines');
    series.forEach(function (s) {
      var ghosts = el('div', 'ghosts');
      s.missed.forEach(function (p) { ghosts.appendChild(el('span', null, period(p))); });
      var prepare = el('button', 'ghost', t('prepare', { period: period(s.missed[0]) }));
      prepare.onclick = function () {
        send(prepare, t('prepare_message', { series: s.series, period: period(s.missed[0]), last: s.last.path }));
      };
      lines.appendChild(add(el('div', 'line'), add(el('div'), el('b', null, docName(s.series)),
        el('small', null, s.series.split('/').slice(0, -1).join('/') + ' · ' + t('every_' + s.every) + ' · ' +
          t('last', { period: period(s.last.period) })), ghosts), prepare));
    });
    return add(el('section'), add(el('h2'), icon('calendar'), t('missed_title'), el('span', 'count', series.length)), lines);
  }

  function outdated() {
    var docs = state.data.outdated || [];
    if (!docs.length) return null;
    var lines = el('div', 'lines');
    docs.forEach(function (d) {
      lines.appendChild(add(el('div', 'line'), add(el('div'), el('b', null, docName(d.path)),
        el('small', null, d.path + (d.note ? ' · ' + d.note : '')))));
    });
    var update = el('button', 'ghost', t('update'));
    update.onclick = function () {
      send(update, t('update_message') + '\n' + docs.map(function (d) {
        return '- ' + d.path + (d.note ? ' (' + d.note + ')' : '');
      }).join('\n'));
    };
    return add(el('section'), add(el('h2'), icon('alert'), t('outdated_title'), el('span', 'count', docs.length),
      add(el('span', 'end'), update)), lines);
  }

  function header() {
    var d = state.data, tot = d.totals;
    var pills = add(el('div', 'pills'),
      add(el('span', 'pill'), icon('sun'), t('commits', { n: tot.commits, weeks: d.weeks })),
      add(el('span', 'pill accent'), icon('wind'), t('ai', { n: Math.round(tot.ai_share * 100) })),
      add(el('span', 'pill'), icon('fog'), t('fog', { n: tot.fog })),
      add(el('span', tot.storms ? 'pill warn' : 'pill'), icon('bolt'), tot.storms ? t('storms', { n: tot.storms }) : t('no_storm')));
    return add(el('header'), el('h1', null, t('title')), pills);
  }

  // Claude writes the bulletin, with what the review settled.
  function bulletinButton() {
    var write = add(el('button', 'primary'), t('bulletin'), icon('arrow'));
    write.onclick = function () {
      var text = t('bulletin_message', { weeks: state.data.weeks });
      if (state.decisions.length) text += '\n' + t('decisions') + '\n' + decisionLines();
      send(write, text);
    };
    return write;
  }

  function render() {
    app.className = '';
    app.replaceChildren();
    add(app, header(), layers(), el('p', 'legend', t('legend_' + state.layer, { months: state.data.months, weeks: state.data.weeks })));
    add(app, ranking(), missed(), outdated(),
      add(el('div', 'actions'), state.decisions.length ? el('span', 'note', tally()) : null, bulletinButton()));
  }

  // ── the review deck ───────────────────────────────────────────────────────

  function tally() {
    var n = { holds: 0, outdated: 0, gone: 0 };
    state.decisions.forEach(function (d) { n[d.verdict]++; });
    return t('tally', n);
  }

  function decisionLines() {
    return state.decisions.map(function (d) { return '- ' + d.path + ' : ' + t('v_' + d.verdict); }).join('\n');
  }

  // The model sees only the last update before the next message: send the whole review so far.
  function syncModel() {
    atlasApp.request('ui/update-model-context', {
      content: [{ type: 'text', text: t('context', { tally: tally() }) + '\n' + decisionLines() }],
      structuredContent: { decisions: state.decisions },
    }).catch(function () {});
  }

  function call(name, args) {
    return atlasApp.request('tools/call', { name: name, arguments: args }).then(kit.data);
  }

  function deck(prefix) {
    app.classList.add('busy');
    call('stale', { months: state.data.months, prefix: prefix, limit: 30 }).then(function (d) {
      var review = { prefix: prefix, docs: d.stale, at: 0, done: {} };
      showCard(review);
    }, function (e) { kit.status(t('error', { message: e.message }), 'error'); });
  }

  // A doc read as prose: its title, then headings, paragraphs and lists without the Markdown marks.
  function preview(text, path) {
    if (/\.html$/.test(path)) return { title: docName(path), blocks: [el('p', null, t('html_doc'))] };
    var lines = text.replace(/^<untrusted[^>]*>\n?|<\/untrusted>\s*$/g, '').split('\n');
    if (lines[0] === '---') lines = lines.slice(lines.indexOf('---', 1) + 1);  // frontmatter
    var title = null, blocks = [], para = [], list = null, code = null;
    function plain(s) {
      return s.replace(/\*\*|__|`/g, '').replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, function (_, target, label) { return label || target; })
        .replace(/!?\[([^\]]*)\]\([^)]+\)/g, '$1').trim();
    }
    function flush() {
      if (para.length) blocks.push(el('p', null, para.join('').trim()));
      para = [];
      list = null;
    }
    lines.forEach(function (line) {
      if (/^\s*(```|~~~)/.test(line)) {
        if (code) { blocks.push(el('pre', null, code.join('\n'))); code = null; } else { flush(); code = []; }
        return;
      }
      if (code) return code.push(line);
      var heading = /^(#{1,6})\s+(.+)/.exec(line), item = /^\s*(?:[-*+]|\d+[.)])\s+(.*)/.exec(line);
      if (heading && !title && !blocks.length && !para.length) return (title = plain(heading[2]));
      if (heading) { flush(); return blocks.push(el('h4', null, plain(heading[2]))); }
      if (/^\s*\|[\s:|-]+\|\s*$/.test(line)) return;  // a table's header rule
      if (!line.trim() || /^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) return flush();
      if (item) {
        if (!list) { flush(); list = el('ul'); blocks.push(list); }
        return list.appendChild(el('li', null, plain(item[1].replace(/^\[ \]\s*/, '☐ ').replace(/^\[x\]\s*/i, '☑ '))));
      }
      var row = /^\s*\|(.*)\|\s*$/.exec(line);
      if (list && !row && /^\s+\S/.test(line)) return (list.lastChild.textContent += ' ' + plain(line));
      list = null;
      // A table row, or a line ending in a hard break, keeps its line.
      para.push(row ? row[1].split('|').map(plain).filter(Boolean).join(' · ') + '\n'
                    : plain(line.replace(/^\s*>\s?/, '').replace(/\\$/, '')) +(/( {2,}|\\)$/.test(line) ? '\n' : ' '));
    });
    flush();
    return { title: title || docName(path), blocks: blocks };
  }

  // Who last touched the doc, from read_doc's footer: "last edited <date> by <who> (AI <name>)".
  function editedLine(doc, footer) {
    var by = /^last edited \S+(?: by (.+?))?(?: \(AI ([^)]+)\))?$/.exec(footer.split(' · ')[2] || '') || [];
    var date = new Date(doc.last_modified * 1000).toLocaleDateString(kit.lang, { day: 'numeric', month: 'long', year: 'numeric' });
    if (by[2]) return t('edited_ai', { date: date, ai: by[2] });
    return by[1] ? t('edited_by', { date: date, who: by[1] }) : t('edited', { date: date });
  }

  function showCard(review) {
    app.className = '';
    var back = add(el('button', 'back'), icon('back'), t('back'));
    back.onclick = function () { document.onkeydown = null; render(); };
    var docs = review.docs, n = docs.length;
    if (review.at >= n) return finish(review);
    var doc = docs[review.at];
    var bar = el('i');
    bar.style.width = (100 * (review.at + 1) / n) + '%';
    var card = add(el('div', 'card'), el('p', 'note', t('loading_doc')));
    var where = add(el('span', 'where'), el('b', null, review.prefix || t('root')), ' · ', t('progress', { i: review.at + 1, n: n }));
    app.replaceChildren(add(el('div', 'deck-top'), back, where), add(el('div', 'progress'), bar), card);
    var choices = [['holds', 'check', '1'], ['outdated', 'clock', '2'], ['gone', 'trash', '3']];
    function decide(verdict) {
      document.onkeydown = null;
      var next = function () { review.at++; showCard(review); };
      if (verdict === 'skip') return next();
      var act = verdict === 'gone' ? call('delete_doc', { path: doc.path })
                                   : call('confirm_doc', { path: doc.path, verdict: verdict });
      card.classList.add('busy');
      act.then(function () {
        state.decisions.push({ path: doc.path, verdict: verdict });
        syncModel();
        next();
      }, function (e) {
        card.replaceChildren(el('p', 'error', t('error', { message: e.message })));
      });
    }
    // An HTML page is not previewed: its first line is enough for the footer.
    var range = /\.html$/.test(doc.path) ? { start_line: 1, end_line: 1 } : {};
    atlasApp.request('tools/call', { name: 'read_doc', arguments: Object.assign({ path: doc.path }, range) }).then(function (result) {
      var blocks = (result && result.content) || [];
      var shown = preview((blocks[0] && blocks[0].text) || '', doc.path);
      var footer = ((blocks[1] && blocks[1].text) || '').replace(/^\[|\]$/g, '');
      var verdicts = el('div', 'verdicts');
      choices.forEach(function (c) {
        var button = add(el('button', c[0]), add(el('b'), icon(c[1]), t(c[0])), el('small', null, t(c[0] + '_hint')), el('kbd', null, c[2]));
        button.onclick = function () { decide(c[0]); };
        verdicts.appendChild(button);
      });
      var later = add(el('button'), t('later'), icon('arrow'));
      later.onclick = function () { decide('skip'); };
      var text = add.apply(null, [el('div', 'text')].concat(shown.blocks));
      var more = el('button', 'link', t('read_all'));
      var box = add(el('div', 'preview clipped'), text, more);
      more.onclick = function () { box.classList.remove('clipped'); more.remove(); };
      card.replaceChildren(el('h3', null, shown.title), el('p', 'path', doc.path),
        add(el('div', 'meta'), el('span', 'pill warn', t('unread', { n: Math.round(doc.months_ago) })), el('span', null, editedLine(doc, footer)),
          doc.confirmed ? el('span', null, t('confirmed_on', { date: new Date(doc.confirmed * 1000).toLocaleDateString(kit.lang) })) : null),
        box, el('p', 'ask', t('ask')), verdicts, add(el('div', 'later'), later));
      if (text.scrollHeight <= text.clientHeight + 2) more.click();  // short enough to read whole
      document.onkeydown = function (e) {
        var key = { '1': 'holds', '2': 'outdated', '3': 'gone', ArrowRight: 'skip', ' ': 'skip' }[e.key];
        if (key) { e.preventDefault(); decide(key); }
      };
    }, function (e) {
      card.replaceChildren(el('p', 'error', t('error', { message: e.message })));
    });
  }

  function finish(review) {
    // The map's numbers move with the review: one less in the fog per doc settled.
    var settled = state.decisions.filter(function (d) { return !review.done[d.path] && within(d.path, review.prefix); });
    settled.forEach(function (d) {
      review.done[d.path] = true;
      regionsOf(d.path).forEach(function (path) {
        var r = find(path);
        if (r && r.fog) r.fog--;
      });
      state.data.totals.fog = Math.max(0, state.data.totals.fog - 1);
    });
    var again = add(el('button', 'ghost'), icon('back'), t('back'));
    again.onclick = function () { render(); };
    app.replaceChildren(add(el('div', 'done'), el('h3', null, t('done_title')), el('p', 'note', tally())),
      add(el('div', 'actions'), again, bulletinButton()));
  }

  // ── start ─────────────────────────────────────────────────────────────────

  function show(result) {
    try {
      state.data = kit.data(result);
    } catch (e) {
      return kit.status(e.message === '?' ? t('error', { message: '?' }) : e.message, 'error');
    }
    render();
  }

  atlasApp.on('ui/notifications/tool-input', function () { kit.loading(''); });
  atlasApp.on('ui/notifications/tool-result', show);
  atlasApp.on('ui/notifications/tool-cancelled', function () { kit.status(t('cancelled')); });
  kit.loading('');
  atlasApp.start('atlas-weather').catch(function (e) { kit.status(t('error', { message: e.message }), 'error'); });
})();
</script>
</body>
</html>
