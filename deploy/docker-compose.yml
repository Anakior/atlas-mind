# docker-compose.yml — the engine of THIS checkout in the cloud-mode image of the
# neighboring Dockerfile (port 8765, non-root user `app` uid 10001): what to run to
# try unreleased engine code the way it is deployed. A real deployment takes the
# PyPI release instead: `atlas deploy <mind> --target compose` writes its files.
#
#   SESSION_SECRET=<long random value> docker compose -f deploy/docker-compose.yml up -d --build
#
# The mind (atlas.toml, content/, .atlas/) is mounted at /app/repo, where the
# image expects it (KB_REPO_PATH=/app/repo), readable/writable by uid 10001. A
# mind with its .git is served as is (the server commits after each write); an
# empty folder gets a clone of GITHUB_REPO_URL, or a new mind without it.
services:
  atlas:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # Mind volume: replace ../mind with the path to YOUR mind.
      - ../mind:/app/repo
    environment:
      # Accounts, tokens and shares as JSON files in <mind>/.atlas (no database):
      # they persist in the mind volume and are never committed.
      ATLAS_STORE: file
      # The image runs with accounts (KB_AUTH_ENABLED=1), which needs a long random
      # session secret: the server refuses to start without one.
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET to a long random value}"
      # Optional: cloned into an EMPTY mind folder at the first boot, then pulled from
      # and pushed to. A mind that has its .git syncs with its own upstream instead.
      # GITHUB_REPO_URL: "https://x-access-token:<PAT>@github.com/user/mind.git"
      # Behind a reverse proxy (see Caddyfile.example — the proxy must
      # OVERWRITE the header, not append to the value received from the client; if a list,
      # Atlas takes the last element, set by the trusted proxy):
      # ATLAS_TRUSTED_IP_HEADER: "X-Forwarded-For"
